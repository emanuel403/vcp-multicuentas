<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCP · DASHBOARD PROFESIONAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --glass: rgba(255, 255, 255, 0.9);
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      
      /* Platform Colors */
      --tiktok: #000000;
      --instagram: #E1306C;
      --facebook: #1877F2;
      --youtube: #FF0000;
      --total: #6366f1;
      
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(225, 48, 108, 0.05) 0px, transparent 50%);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* HEADER & NAV */
    nav {
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-brand {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(90deg, var(--text-main), var(--total));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* TABS MODERNOS */
    .tabs-container {
      max-width: 1200px;
      margin: 30px auto 10px;
      padding: 0 24px;
    }

    .tabs-wrap {
      display: flex;
      gap: 8px;
      background: #e2e8f0;
      padding: 6px;
      border-radius: 14px;
      width: fit-content;
    }

    .tab-btn {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
    }

    .tab-btn.active {
      background: white;
      color: var(--total);
      box-shadow: var(--shadow);
    }

    /* KPI CARDS */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: white;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }

    .kpi-card:hover { transform: translateY(-4px); }

    .kpi-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; margin: 8px 0; }

    /* TABLES */
    .card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 30px;
    }

    .card-header {
      padding: 24px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      background: #f8fafc;
      padding: 16px 24px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .data-table td { padding: 18px 24px; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
    .data-table tr:hover td { background-color: #f8fafc; }

    /* PROGRESS BAR */
    .bar-wrap { display: flex; align-items: center; gap: 12px; width: 100%; }
    .bar-track { height: 8px; flex-grow: 1; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--total), #818cf8); }

    /* BONO CARD */
    .bono-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 1px solid #fcd34d;
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .bono-icon {
      width: 50px; height: 50px;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.1);
    }

    /* BUTTONS */
    #refresh-btn {
      background: var(--text-main);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    #refresh-btn:hover { opacity: 0.9; }

    @media (max-width: 768px) {
      .nav-brand span { display: none; }
      .kpi-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
    VCP <span>· MULTICUENTAS</span>
  </div>
  <div style="display: flex; gap: 15px; align-items: center;">
    <div id="status-badge" style="font-size: 12px; font-weight: 700;">● Sistema Activo</div>
    <button id="refresh-btn" onclick="loadData()">Actualizar</button>
  </div>
</nav>

<main style="max-width: 1200px; margin: 0 auto; padding: 20px 24px;">
  
  <div style="margin-bottom: 40px;">
    <h1 style="font-family: 'Syne', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -1px;">
      Performance <span style="color: var(--total);">Hub</span>
    </h1>
    <p id="last-updated" style="color: var(--text-muted); font-weight: 500;">Sincronizando con base de datos...</p>
  </div>

  <div class="tabs-wrap" style="margin-bottom: 30px;">
    <button class="tab-btn active" onclick="switchTab('resumen')">Resumen General</button>
    <button class="tab-btn" onclick="switchTab('s1')">Semana 1</button>
    <button class="tab-btn" onclick="switchTab('s2')">Semana 2</button>
    <button class="tab-btn" onclick="switchTab('s3')">Semana 3</button>
    <button class="tab-btn" onclick="switchTab('s4')">Semana 4</button>
  </div>

  <div id="tab-resumen" class="section active">
    <div class="kpi-row" id="resumen-kpis">
        </div>

    <div class="card">
      <div class="card-header">
        <h3 style="font-family: 'Syne';">Cuentas Vinculadas</h3>
        <span style="font-size: 12px; background: #e2e8f0; padding: 4px 12px; border-radius: 20px; font-weight: 700;">Mensual</span>
      </div>
      <div style="overflow-x: auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Nombre de Cuenta</th>
              <th>S1</th>
              <th>S2</th>
              <th>S3</th>
              <th>S4</th>
              <th style="text-align: right;">Total Acumulado</th>
            </tr>
          </thead>
          <tbody id="resumen-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-s1" class="section" style="display:none;"></div>
  <div id="tab-s2" class="section" style="display:none;"></div>
  <div id="tab-s3" class="section" style="display:none;"></div>
  <div id="tab-s4" class="section" style="display:none;"></div>

</main>

  // pero los strings de HTML dentro de renderResumen() y renderSemana() deben usar las nuevas clases.
  
  // EJEMPLO DE CAMBIO EN renderResumen para el nuevo estilo:
  function renderResumen(data) {

    const kpis = document.getElementById('resumen-kpis');
    kpis.innerHTML = `
      <div class="kpi-card" style="border-bottom: 4px solid var(--total)">
        <div class="kpi-label">Vistas Totales</div>
        <div class="kpi-value">${fmt(totalMes)}</div>
        <div style="color: var(--total); font-size: 12px; font-weight: 700;">↑ Rendimiento Mes</div>
      </div>
      `;
    
    // ... resto de la lógica ...
  }
</script>

</body>
</html>
